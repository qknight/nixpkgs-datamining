<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Zoomable Sunburst – identical rlibs</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #111; color: #eee; }
  #chart { width: 100vw; height: 100vh; }
  .tooltip {
    position: absolute; pointer-events: none;
    background: rgba(0,0,0,0.85); color: #fff;
    padding: 6px 10px; border-radius: 4px; font-size: 13px;
    opacity: 0; transition: opacity 0.15s;
  }
  #controls {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    background: rgba(0,0,0,0.75); padding: 12px 16px; border-radius: 8px;
    max-width: 360px;
  }
  input[type="file"] { color: #ccc; }
  .info { font-size: 12px; color: #aaa; margin-top: 6px; }
</style>
</head>
<body>

<div id="controls">
  <div style="margin-bottom:6px;">Load data file (count name hash):</div>
  <input type="file" id="fileInput" accept=".txt,.csv,.dat,text/*">
  <div class="info" id="status">No file loaded</div>
</div>

<div id="chart"></div>
<div class="tooltip" id="tooltip"></div>

<script>
const width = window.innerWidth;
const height = window.innerHeight;
const radius = Math.min(width, height) / 2;

const svg = d3.select("#chart").append("svg")
  .attr("viewBox", `${-width/2} ${-height/2} ${width} ${height}`)
  .style("font", "11px sans-serif");

const g = svg.append("g");
const tooltip = d3.select("#tooltip");
const status = document.getElementById("status");

// smooth RGB spectrum (0 → 1)
const rgbSpectrum = t => {
  // full cycle through hue
  const h = t * 360;
  return d3.hsl(h, 0.65, 0.55).formatHex();
};

document.getElementById("fileInput").addEventListener("change", function(e) {
  const file = e.target.files[0];
  if (!file) return;

  status.textContent = "Reading " + file.name + " …";

  const reader = new FileReader();
  reader.onload = function(ev) {
    const text = ev.target.result;
    const rootData = parseData(text);
    status.textContent = `Loaded ${file.name} (${rootData.children.length} categories)`;
    render(rootData);
  };
  reader.onerror = () => status.textContent = "Error reading file";
  reader.readAsText(file);
});

function parseData(text) {
  const lines = text.trim().split("\n").filter(l => l.trim());
  const multi = new Map();
  const singles = [];
  let unknownValue = 0;

  for (const line of lines) {
    const parts = line.trim().split(/\s+/);
    if (parts.length < 2) {
      unknownValue += 1;
      continue;
    }

    const count = +parts[0];
    if (isNaN(count) || count < 1) {
      unknownValue += 1;
      continue;
    }

    const base = parts[1];
    const hash = parts[2] || "(no-hash)";

    if (count === 1) {
      singles.push({
        name: `${base} · ${hash.slice(0, 8)}`,
        value: 1,
        totalRefs: 1,
        children: [{ name: hash, value: 1 }]
      });
    } else {
      if (!multi.has(base)) multi.set(base, []);
      multi.get(base).push({ name: hash, value: count });
    }
  }

  const children = [];

  if (unknownValue > 0) {
    children.push({
      name: "unknown",
      value: unknownValue,
      totalRefs: unknownValue,
      children: [{ name: `${unknownValue} unparsable`, value: unknownValue }]
    });
  }

  for (const [base, entries] of multi) {
    entries.sort((a, b) => b.value - a.value);
    const groupCount = entries.length;
    const sumRefs    = d3.sum(entries, d => d.value);

    children.push({
      name: base,
      value: groupCount,
      totalRefs: sumRefs,
      children: entries
    });
  }

  children.push(...singles);

  children.sort((a, b) => {
    if (a.name === "unknown") return -1;
    if (b.name === "unknown") return 1;
    return b.value - a.value;
  });

  return { name: "root", children };
}

function render(data) {
  g.selectAll("*").remove();

  const root = d3.hierarchy(data)
    .sum(d => d.children ? 0 : d.value)
    .sort((a, b) => b.value - a.value);

  d3.partition().size([2 * Math.PI, radius])(root);

  // colour each top-level category by its index through RGB space
  const topLevel = root.children || [];
  const color = i => rgbSpectrum(i / Math.max(1, topLevel.length - 1));

  const arc = d3.arc()
    .startAngle(d => d.x0)
    .endAngle(d => d.x1)
    .padAngle(1 / radius)
    .padRadius(radius / 2)
    .innerRadius(d => d.y0)
    .outerRadius(d => d.y1 - 1);

  // centre circle – always clickable to return to root
  g.append("circle")
    .attr("r", radius * 0.28)
    .attr("fill", "#222")
    .attr("fill-opacity", 0.6)
    .style("cursor", "pointer")
    .on("click", (event) => {
      event.stopPropagation();
      clicked(null, root);
    });

  const path = g.selectAll("path")
    .data(root.descendants().filter(d => d.depth))
    .join("path")
      .attr("fill", d => {
        let p = d;
        while (p.depth > 1) p = p.parent;
        const idx = topLevel.indexOf(p);
        return color(idx >= 0 ? idx : 0);
      })
      .attr("fill-opacity", d => d.depth === 1 ? 0.82 : 0.55)
      .attr("d", arc)
      .style("cursor", "pointer")
      .on("click", clicked)
      .on("mousemove", (event, d) => {
        const pct = ((d.value / root.value) * 100).toFixed(1);
        let html = `<strong>${d.data.name}</strong><br>${d.value} (${pct}%)`;
        if (d.data.totalRefs !== undefined && d.data.totalRefs !== d.value) {
          html += `<br>total refs: ${d.data.totalRefs}`;
        }
        tooltip
          .style("opacity", 1)
          .html(html)
          .style("left", (event.pageX + 12) + "px")
          .style("top", (event.pageY - 28) + "px");
      })
      .on("mouseleave", () => tooltip.style("opacity", 0));

  const label = g.append("text")
    .attr("text-anchor", "middle")
    .attr("fill", "#fff")
    .style("font-size", "14px")
    .style("pointer-events", "none");

  function updateLabel(d) {
    const pct = ((d.value / root.value) * 100).toFixed(1);
    let text = `${d.data.name}  ·  ${d.value} (${pct}%)`;
    if (d.data.totalRefs !== undefined && d.data.totalRefs !== d.value) {
      text += `  ·  ${d.data.totalRefs} refs`;
    }
    label.text(text);
  }
  updateLabel(root);

  function clicked(event, p) {
    // if centre was clicked we already forced p = root
    if (!p) p = root;

    root.each(d => d.target = {
      x0: Math.max(0, Math.min(1, (d.x0 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
      x1: Math.max(0, Math.min(1, (d.x1 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
      y0: Math.max(0, d.y0 - p.depth),
      y1: Math.max(0, d.y1 - p.depth)
    });

    const t = g.transition().duration(750);

    path.transition(t)
      .tween("data", d => {
        const i = d3.interpolate(d.current, d.target);
        return t => d.current = i(t);
      })
      .attrTween("d", d => () => arc(d.current));

    root.each(d => d.current = d.target);
    updateLabel(p.depth ? p : root);
  }

  root.each(d => d.current = d);
}
</script>
</body>
</html>
