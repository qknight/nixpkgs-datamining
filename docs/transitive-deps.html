  // Parse: name version project direct transitive
const depsLines = depsRaw.split('\n').filter(Boolean);
const parsed = depsLines.map(line => {
  const [name, version, projectStr, directStr, transStr] = line.trim().split(/\s+/);
  const project = Number(projectStr);
  const direct = Number(directStr);
  const transitive = Number(transStr);
  return { name, version, project, direct, transitive };
});

// Compute per-entry total as project + direct + transitive
const deps = parsed.map(d => ({
  ...d,
  stackTotal: d.project + d.direct + d.transitive
})).sort((a, b) => b.stackTotal - a.stackTotal);

const labels = deps.map(d => `${d.name}`);
const projectCrates = deps.map(d => d.project);
const stackTotals = deps.map(d => d.stackTotal);

const traces = [
  // Bottom of the stack: project crates (numeric from input)
  {
    type: 'bar',
    name: 'Project crates',
    x: labels,
    y: projectCrates,
    hovertemplate: 'name: %{x}<br>version: %{customdata[0]}<br>transitive: %{customdata[2]}<br>direct: %{customdata[3]}<br>project: %{y}<br>total (transitive+direct+project): %{customdata[4]}<extra></extra>',
    // Pass consistent customdata: [version, project, transitive, direct, total]
    customdata: deps.map((d, i) => [d.version, projectCrates[i], d.transitive, d.direct, projectCrates[i] + d.direct + d.transitive])
  },
  // Middle: direct
  {
    type: 'bar',
    name: 'Direct',
    x: labels,
    y: deps.map(d => d.direct),
//        hovertemplate: '%{x}<br>Project size: %{y} crates<br>v%{customdata[0]}<br>Total (stack): %{customdata[2]}<extra></extra>',

    hovertemplate: 'name: %{x}<br>version: %{customdata[0]}<br>transitive: %{customdata[2]}<br>direct: %{y}<br>project: %{customdata[1]}<br>total (transitive+direct+project): %{customdata[4]}<extra></extra>',
    customdata: deps.map((d, i) => [d.version, projectCrates[i], d.transitive, d.direct, projectCrates[i] + d.direct + d.transitive])
  },
  // Top: transitive
  {
    type: 'bar',
    name: 'Transitive',
    x: labels,
    y: deps.map(d => d.transitive),
    hovertemplate: 'name: %{x}<br>version: %{customdata[0]}<br>transitive: %{y}<br>direct: %{customdata[3]}<br>project: %{customdata[1]}<br>total (transitive+direct+project): %{customdata[4]}<extra></extra>',
    customdata: deps.map((d, i) => [d.version, projectCrates[i], d.transitive, d.direct, projectCrates[i] + d.direct + d.transitive])
  }

    showlegend: true
  };

  const config = { responsive: true };

  Plotly.newPlot('myDiv', traces, layout, config);


const statsDiv = document.getElementById('stats');
if (statsDiv) {
  // Use already-parsed 'deps' to compute aggregates
  const projectCount = deps.length;

  const totalInternal = deps.reduce((sum, d) => sum + d.project, 0);
  const totalDirect = deps.reduce((sum, d) => sum + d.direct, 0);
  const totalTransitive = deps.reduce((sum, d) => sum + d.transitive, 0);
  const grandTotal = totalInternal + totalDirect + totalTransitive;

  const avg = (sum) => (projectCount ? sum / projectCount : 0);
  const pct = (part) => (grandTotal ? (part / grandTotal) * 100 : 0);

  // New: percentile helpers and stats for direct/internal
  const quantile = (sorted, q) => {
    if (!sorted.length) return 0;
    const pos = (sorted.length - 1) * q;
    const base = Math.floor(pos);
    const rest = pos - base;
    return sorted[base + 1] !== undefined
      ? sorted[base] + rest * (sorted[base + 1] - sorted[base])
      : sorted[base];
  };

  const calcStats = (arr) => {
    const s = [...arr].sort((a, b) => a - b);
    const n = s.length;
    return {
      min: n ? s[0] : 0,
      max: n ? s[n - 1] : 0,
      median: quantile(s, 0.5),
      p25: quantile(s, 0.25),
      p75: quantile(s, 0.75),
      p90: quantile(s, 0.9)
    };
  };

  const directStats = calcStats(deps.map(d => d.direct));
  const internalStats = calcStats(deps.map(d => d.project));

  const html = projectCount
    ? `
      <section class="stats-section">
        <h3>Project Analysis</h3>
        <ul>
          <li><strong>Total Projects Analyzed:</strong> ${projectCount}</li>
          <li><strong>Average Internal Crates per Project:</strong> ${avg(totalInternal).toFixed(1)}</li>
          <li><strong>Average Direct Dependencies per Project:</strong> ${avg(totalDirect).toFixed(1)}</li>
          <li><strong>Average Transitive Dependencies per Project:</strong> ${avg(totalTransitive).toFixed(1)}</li>
        </ul>

        <h3>Overall Dependency Count</h3>
        <ul>
          <li><strong>Total Internal Crates:</strong> ${totalInternal}</li>
          <li><strong>Total Direct Dependencies:</strong> ${totalDirect}</li>
          <li><strong>Total Transitive Dependencies:</strong> ${totalTransitive}</li>
        </ul>

        <h3>Total & Percentage Breakdown</h3>
        <ul>
          <li><strong>Total Crates Count:</strong> ${grandTotal}</li>
          <li><strong>Internal Crates:</strong> ${pct(totalInternal).toFixed(1)}% of Total</li>
          <li><strong>Direct Dependencies:</strong> ${pct(totalDirect).toFixed(1)}% of Total</li>
          <li><strong>Transitive Dependencies:</strong> ${pct(totalTransitive).toFixed(1)}% of Total</li>
          <li><strong>Combined Direct and Transitive Dependencies:</strong> ${pct(totalDirect + totalTransitive).toFixed(2)}% of Total</li>
        </ul>

        <h3>Direct Dependencies Distribution</h3>
        <ul>
          <li>median=${directStats.median}, p25=${directStats.p25}, p75=${directStats.p75}, p90=${directStats.p90}, min=${directStats.min}, max=${directStats.max}</li>
          <li>p75 of the projects use <= ${directStats.p75.toFixed(1)} direct dependencies</li>
        </ul>

        <h3>Internal Crates Distribution</h3>
        <ul>
          <li>median=${internalStats.median}, p25=${internalStats.p25}, p75=${internalStats.p75}, p90=${internalStats.p90}, min=${internalStats.min}, max=${internalStats.max}</li>
          <li>p75 of the projects use <= ${internalStats.p75.toFixed(1)} main crates</li>
        </ul>
      </section>
    `
    : `<em>No dependency data available.</em>`;

  statsDiv.innerHTML = html;
}


</script>
