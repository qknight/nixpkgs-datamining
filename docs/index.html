<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Stacked Bar – identical rlibs</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #111; color: #eee; }
  #controls {
    position: sticky; top: 0; z-index: 10;
    background: rgba(0,0,0,0.85); padding: 12px 16px;
    border-bottom: 1px solid #333;
  }
  input[type="file"] { color: #ccc; }
  .info { font-size: 12px; color: #aaa; margin-top: 4px; }
  #chart { padding: 20px 20px 40px 20px; }
  .tooltip {
    position: absolute; pointer-events: none;
    background: rgba(0,0,0,0.9); color: #fff;
    padding: 6px 10px; border-radius: 4px; font-size: 13px;
    opacity: 0; transition: opacity 0.15s; z-index: 20;
  }
</style>
</head>
<body>

<div id="controls">
  <div>Load data file (count name hash):</div>
  <input type="file" id="fileInput" accept=".txt,.csv,.dat,text/*">
  <div class="info" id="status">No file loaded</div>
</div>

<div id="chart"></div>
<div class="tooltip" id="tooltip"></div>

<script>
const tooltip = d3.select("#tooltip");
const status  = document.getElementById("status");

const rgbSpectrum = t => d3.hsl(t * 360, 0.65, 0.55).formatHex();

document.getElementById("fileInput").addEventListener("change", function(e) {
  const file = e.target.files[0];
  if (!file) return;
  status.textContent = "Reading " + file.name + " …";

  const reader = new FileReader();
  reader.onload = ev => {
    const data = parseData(ev.target.result);
    status.textContent = `Loaded ${file.name} (${data.length} bars)`;
    render(data);
  };
  reader.onerror = () => status.textContent = "Error reading file";
  reader.readAsText(file);
});

function parseData(text) {
  const lines = text.trim().split("\n").filter(l => l.trim());
  const multi = new Map();   // base → [{hash, count}]
  let uniqueCount = 0;
  let unknownCount = 0;

  for (const line of lines) {
    const parts = line.trim().split(/\s+/);
    if (parts.length < 2) { unknownCount++; continue; }

    const count = +parts[0];
    if (isNaN(count) || count < 1) { unknownCount++; continue; }

    const base = parts[1];
    const hash = parts[2] || "(no-hash)";

    if (count === 1) {
      uniqueCount++;
    } else {
      if (!multi.has(base)) multi.set(base, []);
      multi.get(base).push({ name: hash, value: count });
    }
  }

  const result = [];

  // unknown first
  if (unknownCount > 0) {
    result.push({
      name: "unknown",
      total: unknownCount,
      stacks: [{ name: "unparsable", value: unknownCount }]
    });
  }

  // multi groups – sorted later
  for (const [base, entries] of multi) {
    entries.sort((a, b) => b.value - a.value);
    const total = d3.sum(entries, d => d.value);
    result.push({
      name: base,
      total: total,
      stacks: entries
    });
  }

  // all count=1 collected into one bar
  if (uniqueCount > 0) {
    result.push({
      name: "unique (1)",
      total: uniqueCount,
      stacks: [{ name: "singletons", value: uniqueCount }]
    });
  }

  // final sort: unknown first, then by total refs descending
  result.sort((a, b) => {
    if (a.name === "unknown") return -1;
    if (b.name === "unknown") return 1;
    return b.total - a.total;
  });

  return result;
}

function render(data) {
  d3.select("#chart").selectAll("*").remove();

  if (!data.length) return;

  const margin = { top: 20, right: 40, bottom: 30, left: 220 };
  const barHeight = 22;
  const height = data.length * barHeight + margin.top + margin.bottom;
  const width  = Math.max(900, window.innerWidth - 40);

  const svg = d3.select("#chart")
    .append("svg")
    .attr("width", width)
    .attr("height", height)
    .append("g")
    .attr("transform", `translate(${margin.left},${margin.top})`);

  const innerWidth  = width - margin.left - margin.right;
  const innerHeight = data.length * barHeight;

  // x scale = total reference count
  const x = d3.scaleLinear()
    .domain([0, d3.max(data, d => d.total)])
    .range([0, innerWidth])
    .nice();

  const y = d3.scaleBand()
    .domain(data.map(d => d.name))
    .range([0, innerHeight])
    .padding(0.15);

  // colour each bar’s stacks from the RGB spectrum
  // we assign a base hue per bar, then vary lightness inside the stack
  data.forEach((d, i) => {
    d.baseColor = rgbSpectrum(i / Math.max(1, data.length - 1));
  });

  // stacked series
  const stack = d3.stack()
    .keys(d3.range(d3.max(data, d => d.stacks.length)))  // max number of stacks
    .value((d, key) => d.stacks[key] ? d.stacks[key].value : 0);

  // we need a uniform key set – build a temporary structure
  const maxStacks = d3.max(data, d => d.stacks.length);
  const stackedData = data.map(d => {
    const obj = { name: d.name, total: d.total, baseColor: d.baseColor };
    d.stacks.forEach((s, i) => { obj[i] = s.value; obj[`label${i}`] = s.name; });
    for (let i = d.stacks.length; i < maxStacks; i++) obj[i] = 0;
    return obj;
  });

  const series = d3.stack()
    .keys(d3.range(maxStacks))
    .value((d, key) => d[key] || 0)
    (stackedData);

  // draw stacks
  svg.selectAll("g.stack")
    .data(series)
    .join("g")
    .attr("class", "stack")
    .selectAll("rect")
    .data(d => d)
    .join("rect")
      .attr("y", d => y(d.data.name))
      .attr("x", d => x(d[0]))
      .attr("width", d => Math.max(0, x(d[1]) - x(d[0])))
      .attr("height", y.bandwidth())
      .attr("fill", (d, i, nodes) => {
        // colour derived from the bar’s base colour + slight variation
        const base = d3.color(d.data.baseColor);
        const t = d3.select(nodes[i].parentNode).datum().key / maxStacks;
        return base.brighter(0.4 - t * 0.8).formatHex();
      })
      .on("mousemove", (event, d) => {
        const key = d3.select(event.target.parentNode).datum().key;
        const label = d.data[`label${key}`] || "";
        const value = d[1] - d[0];
        const pct = ((value / d.data.total) * 100).toFixed(1);
        tooltip
          .style("opacity", 1)
          .html(`<strong>${d.data.name}</strong><br>${label}<br>${value} (${pct}% of bar)`)
          .style("left", (event.pageX + 12) + "px")
          .style("top", (event.pageY - 28) + "px");
      })
      .on("mouseleave", () => tooltip.style("opacity", 0));

  // y-axis (category names)
  svg.append("g")
    .call(d3.axisLeft(y).tickSize(0))
    .selectAll("text")
    .attr("fill", "#ddd")
    .style("font-size", "12px");

  // x-axis
  svg.append("g")
    .attr("transform", `translate(0,${innerHeight})`)
    .call(d3.axisBottom(x).ticks(8).tickFormat(d3.format("~s")))
    .selectAll("text")
    .attr("fill", "#aaa");

  // total labels at the end of each bar
  svg.selectAll(".total")
    .data(data)
    .join("text")
    .attr("class", "total")
    .attr("x", d => x(d.total) + 6)
    .attr("y", d => y(d.name) + y.bandwidth() / 2)
    .attr("dy", "0.35em")
    .attr("fill", "#ccc")
    .style("font-size", "11px")
    .text(d => d.total.toLocaleString());
}

document.addEventListener("DOMContentLoaded", function() {
  fetch('combined_none-unique.stats')
    .then(response => response.text())
    .then(text => {
      const data = parseData(text);
      status.textContent = `Loaded combined_none-unique.stats (${data.length} bars)`;
      render(data);
    })
    .catch(() => {
      status.textContent = "Error loading combined_none-unique.stats";
    });
});

</script>
</body>
</html>
